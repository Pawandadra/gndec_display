<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            background-color: #f5f5f5;
        }

        #flash-messages {
            text-align: center;
            z-index: 1000;
            width: 90%;
            /* Adjust width as needed */
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .flash-message {
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            opacity: 1;
            transition: opacity 0.5s ease-out;
            /* Smooth fade-out */
        }

        .flash-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .flash-message.hidden {
            opacity: 0;
            /* Fully transparent */
        }

        .logout-btn {
            margin-top: 10px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #cc0000;
        }

        #loader {
            display: none;
            border: 8px solid #f3f3f3;
            /* Light gray */
            border-top: 8px solid #3498db;
            /* Blue */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="flash-messages">
        <h2>Upload a File</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <p class="flash-message {{ category }}">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="/upload" method="post" enctype="multipart/form-data" onsubmit="showLoader()">
            <br>
            <input type="file" id="file" name="file" required><br><br>
            <button type="submit">Upload</button>
        </form>
        <div id="loader"></div>
        <form action="/logout" method="post" style="margin-top: 15px;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <script>

        function showLoader() {
            const loader = document.getElementById('loader');
            loader.style.display = 'block'; // Show loader
        }

        // Wait for the DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            // Find all flash messages
            const flashMessages = document.querySelectorAll('.flash-message');

            // Hide each flash message after 5 seconds
            flashMessages.forEach(message => {
                setTimeout(() => {
                    message.classList.add('hidden'); // Add hidden class for fade-out
                    setTimeout(() => {
                        message.remove(); // Remove from DOM after fade-out
                    }, 500); // Wait for fade-out transition to complete
                }, 5000); // 5 seconds delay
            });
        });
    </script>
</body>

</html>
